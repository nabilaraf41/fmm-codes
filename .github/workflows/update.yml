name: Update codes
on:
  schedule: [{cron: "17 * * * *"}]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python build.py
      - run: |
          git config user.name "fmm-bot"; git config user.email "fmm-bot@users.noreply.github.com"
          git add -A; git diff --cached --quiet || (git commit -m "Update codes" && git push)
